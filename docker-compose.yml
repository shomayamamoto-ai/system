# 予約システム本体（app）と、HTTPS を受け持つ入口（caddy）をまとめて動かす設定。
# 使い方は docs/DEPLOY.md を参照。値は同じフォルダの .env ファイルから読み込む。
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env に ADMIN_PASSWORD を設定してください}
      PUBLIC_URL: https://${DOMAIN:?.env に DOMAIN を設定してください}
      TRUST_PROXY: "1"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - yoyaku-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  yoyaku-data:
  caddy-data:
  caddy-config:
