<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16264a">
<title>面談・相談のご予約</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hero">
  <div class="wrap narrow">
    <div class="eyebrow">ONLINE RESERVATION</div>
    <h1 id="siteName">面談・相談のご予約</h1>
    <p id="siteIntro" hidden></p>
  </div>
</header>
<main class="wrap narrow stack">
  <div id="error" class="msg error" role="alert" hidden></div>

  <!-- 予約フォーム -->
  <div id="form" class="stack steps" hidden>
    <div id="changeNote" class="msg info" hidden></div>
    <section class="card stack" id="secService">
      <h2>ご相談内容を選ぶ</h2>
      <div id="services" class="choices wide"></div>
    </section>
    <section class="card stack" id="secStaff">
      <h2>担当者を選ぶ</h2>
      <div id="staff" class="choices"></div>
    </section>
    <section class="card stack" id="secDate">
      <h2>日時を選ぶ</h2>
      <div class="row spread month-nav">
        <button id="prev" type="button" class="small">← 前の月</button>
        <strong id="monthLabel"></strong>
        <button id="next" type="button" class="small">次の月 →</button>
      </div>
      <div>
        <div class="cal-head" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
        <div id="days" class="cal"></div>
      </div>
      <p class="muted legend"><span>○ 空きあり</span><span>△ 残りわずか</span><span>× 空きなし</span></p>
      <h3 id="slotTitle"></h3>
      <div id="slots"></div>
      <p id="slotsNote" class="muted" aria-live="polite"></p>
    </section>
    <section class="card stack" id="secCustomer">
      <h2>お客様情報を入力する</h2>
      <form id="customer" class="stack">
        <label>お名前（必須）<input name="customerName" required maxlength="80" autocomplete="name" enterkeyhint="next"></label>
        <label>メールアドレス（必須）<input name="email" type="email" inputmode="email" required maxlength="120" autocomplete="email" autocapitalize="off" enterkeyhint="next"></label>
        <label>電話番号（任意）<input name="phone" type="tel" inputmode="tel" maxlength="30" autocomplete="tel" enterkeyhint="next"></label>
        <label>ご相談したい内容（任意）<textarea name="note" maxlength="500"></textarea></label>
      </form>
    </section>
  </div>

  <!-- 予約完了・予約確認 -->
  <section id="done" class="card stack" hidden>
    <div class="done-head">
      <div class="done-icon" id="doneIcon"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="doneTitle">ご予約を受け付けました</h2>
      <p id="doneMail" class="muted" hidden>ご入力のメールアドレスあてに、確認メールをお送りしました。</p>
    </div>
    <dl class="summary" id="doneSummary"></dl>
    <div id="doneBlocked" class="msg info" hidden></div>
    <div class="actions" id="doneActions">
      <a class="btn" id="ics">カレンダーに追加（iPhoneなど）</a>
      <a class="btn" id="gcal" target="_blank" rel="noopener">Googleカレンダーに追加</a>
      <button id="change" type="button">日時を変更する</button>
      <button id="cancel" type="button" class="danger">この予約をキャンセルする</button>
    </div>
    <div id="doneLinkBox" class="stack-s">
      <p class="muted">下のリンクを保存しておくと、あとから予約の確認・変更・キャンセルができます。</p>
      <div class="row">
        <input id="doneLink" class="grow" readonly aria-label="予約確認用のリンク" style="margin:0">
        <button id="copy" type="button">コピー</button>
      </div>
    </div>
    <div style="text-align:center"><a class="btn ghost" href="/">新しく予約する</a></div>
  </section>
  <p class="foot" id="foot"></p>
</main>

<!-- 画面下に固定: 選んだ内容と「予約する」ボタン -->
<div class="cta" id="cta" hidden>
  <div class="wrap narrow">
    <div class="sum" id="picked" aria-live="polite"></div>
    <button class="primary" type="submit" form="customer" id="submit" disabled>予約する</button>
  </div>
</div>
<script src="/booking.js"></script>
</body>
</html>
